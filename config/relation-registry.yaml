# 关系与实体类型的机器权威。kg/ontology.py 加载并强制执行。
#
# 规则：这里只放有消费者的字段。没有代码读的字段不要加——死配置会让人以为
# 某条规则在生效，实际没有。新增关系必须补齐 ontology._validate_definition
# 要求的全部字段，缺一个就加载失败。
version: 4

# 抽取器允许输出的全部证据类型。提示词里的可选值和强弱判定都从这里生成，
# 不在这张表里的值一律不合法。
evidence_types:
  explicit_definition:
    strength: strong
    description: 正文给出定义，且定义本身包含待验证的关系。
  explicit_taxonomy:
    strength: strong
    description: 正文明确表述种属或分类归属。
  explicit_composition:
    strength: strong
    description: 正文明确表述结构组成或流程阶段。
  explicit_function:
    strength: strong
    description: 正文明确表述用途、功能或作用对象。
  explicit_prerequisite:
    strength: strong
    description: 正文明确表述学习顺序或概念依赖。
  explicit_comparison:
    strength: strong
    description: 正文明确对比两者或指出二者可互相替代。
  explicit_derivation:
    strength: strong
    description: 正文明确表述推导、扩展或改编自。
  toc_order:
    strength: weak
    description: 目录或章节编号顺序。
  hyperlink:
    strength: weak
    description: 超链接指向。
  cooccurrence:
    strength: weak
    description: 仅在同一段落出现。

entity_types:
  field: {description: Recognized AI research or teaching field.}
  concept: {description: Abstract idea, property, principle, object, or phenomenon.}
  method: {description: Reusable algorithm, procedure, strategy, or technique.}
  task: {description: Problem definition with inputs, outputs, or a success criterion.}
  model: {description: Named model family or concrete learned or specified model.}
  architecture: {description: Reusable structural design for models or systems.}
  dataset: {description: Named data collection used for training or evaluation.}
  metric: {description: Defined evaluation measurement.}
  loss: {description: Optimization objective or loss function.}
  system: {description: Implemented framework, pipeline, training, or serving system.}
  resource: {description: Paper, textbook, course, specification, or documentation.}

relations:
  is_a:
    lifecycle: core
    family: taxonomy
    description: Subject is a more specific kind of object.
    subject_types: [field, concept, method, task, model, architecture, dataset, metric, loss, system]
    object_types: [field, concept, method, task, model, architecture, dataset, metric, loss, system]
    symmetric: false
    transitive: true
    acyclic: true
    accepted_evidence_types: [explicit_taxonomy, explicit_definition]
    minimum_evidence: {explicit_high_authority: 1, independent_standard_sources: 2}
    validator_version: entailment-validator-1
    high_impact_review: true

  part_of:
    lifecycle: core
    family: composition
    description: Subject is an actual structural constituent or explicitly identified stage of object; usage, dependency, participation, construction, input/output, attributes, and subtype relations are not composition.
    subject_types: [concept, method, model, architecture, loss, system]
    object_types: [concept, method, model, architecture, system]
    symmetric: false
    transitive: contextual
    acyclic: true
    # 只有明确的组成表述算数。explicit_function（用于/作用）恰恰是 description
    # 里点名排除的那类语义，不能计入。
    accepted_evidence_types: [explicit_composition]
    minimum_evidence: {explicit_high_authority: 1, independent_standard_sources: 2}
    validator_version: part-of-validator-1
    high_impact_review: true

  prerequisite_of:
    lifecycle: core
    family: educational
    description: Subject should be learned before object because of a conceptual dependency, explicit derivation, or curriculum recommendation.
    subject_types: [field, concept, method]
    object_types: [field, concept, method, task]
    symmetric: false
    transitive: contextual
    acyclic: true
    qualifiers: [kind, strength, scope]
    required_qualifiers: [kind, strength]
    qualifier_values:
      kind: [conceptual, derivational, curricular]
      strength: [required, recommended]
    accepted_evidence_types: [explicit_prerequisite, explicit_derivation]
    minimum_evidence: {explicit_high_authority: 1, independent_curriculum_sources: 2}
    validator_version: entailment-validator-1
    high_impact_review: true

  subfield_of:
    lifecycle: experimental
    family: taxonomy
    description: Subject field is conventionally organized under object field.
    subject_types: [field]
    object_types: [field]
    symmetric: false
    transitive: true
    acyclic: true
    accepted_evidence_types: [explicit_taxonomy, explicit_definition]
    minimum_evidence: {explicit_high_authority: 1, independent_standard_sources: 2}
    validator_version: entailment-validator-1
    high_impact_review: true

  often_confused_with:
    lifecycle: experimental
    family: educational
    description: Teaching material documents a common confusion.
    subject_types: [field, concept, method, task, model, architecture, metric, loss]
    object_types: [field, concept, method, task, model, architecture, metric, loss]
    symmetric: true
    transitive: false
    acyclic: false
    accepted_evidence_types: [explicit_comparison]
    minimum_evidence: {explicit_high_authority: 1, independent_standard_sources: 2}
    validator_version: entailment-validator-1

  pedagogical_contrast_with:
    lifecycle: experimental
    family: educational
    description: Teaching material explicitly compares the entities.
    subject_types: [field, concept, method, task, model, architecture, metric, loss]
    object_types: [field, concept, method, task, model, architecture, metric, loss]
    symmetric: true
    transitive: false
    acyclic: false
    accepted_evidence_types: [explicit_comparison]
    minimum_evidence: {explicit_high_authority: 1, independent_standard_sources: 2}
    validator_version: entailment-validator-1

  alternative_to:
    lifecycle: experimental
    family: functional
    description: Subject and object are explicit alternatives for substantially the same task or objective.
    subject_types: [method, model, architecture, system]
    object_types: [method, model, architecture, system]
    symmetric: true
    transitive: false
    acyclic: false
    qualifiers: [scope, condition]
    accepted_evidence_types: [explicit_comparison]
    minimum_evidence: {explicit_high_authority: 1, independent_standard_sources: 2}
    validator_version: entailment-validator-1

  used_for:
    lifecycle: experimental
    family: functional
    description: Subject is used to perform or support object task.
    subject_types: [concept, method, model, architecture, system]
    object_types: [task]
    symmetric: false
    transitive: false
    acyclic: false
    accepted_evidence_types: [explicit_function]
    minimum_evidence: {explicit_high_authority: 1, independent_standard_sources: 2}
    validator_version: entailment-validator-1

  solves:
    lifecycle: experimental
    family: functional
    description: Subject is explicitly presented as solving object task.
    subject_types: [method, model, system]
    object_types: [task]
    symmetric: false
    transitive: false
    acyclic: false
    accepted_evidence_types: [explicit_function]
    minimum_evidence: {explicit_high_authority: 1, independent_standard_sources: 2}
    validator_version: entailment-validator-1

  evaluated_by:
    lifecycle: experimental
    family: functional
    description: Subject is evaluated using object metric.
    subject_types: [task, model, system]
    object_types: [metric]
    symmetric: false
    transitive: false
    acyclic: false
    accepted_evidence_types: [explicit_function]
    minimum_evidence: {explicit_high_authority: 1, independent_standard_sources: 2}
    validator_version: entailment-validator-1

  trained_on:
    lifecycle: experimental
    family: functional
    description: Subject model is trained or fine-tuned on object dataset.
    subject_types: [model]
    object_types: [dataset]
    symmetric: false
    transitive: false
    acyclic: false
    qualifiers: [variant, time]
    accepted_evidence_types: [explicit_function]
    minimum_evidence: {explicit_high_authority: 1, independent_standard_sources: 2}
    validator_version: entailment-validator-1

  optimizes:
    lifecycle: experimental
    family: functional
    description: Subject method optimizes object loss or objective concept.
    subject_types: [method]
    object_types: [loss, concept]
    symmetric: false
    transitive: false
    acyclic: false
    accepted_evidence_types: [explicit_function]
    minimum_evidence: {explicit_high_authority: 1, independent_standard_sources: 2}
    validator_version: entailment-validator-1

  derived_from:
    lifecycle: experimental
    family: historical
    description: Subject is explicitly derived, extended, or adapted from object.
    subject_types: [concept, method, model, architecture, loss, system]
    object_types: [concept, method, model, architecture, loss, system]
    symmetric: false
    transitive: false
    acyclic: true
    qualifiers: [time, variant]
    accepted_evidence_types: [explicit_derivation]
    minimum_evidence: {explicit_high_authority: 1, independent_standard_sources: 2}
    validator_version: entailment-validator-1
